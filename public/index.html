<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <title>LUC Vector Map</title>
    <link rel="stylesheet" href="./styles.css?v=20261030-mobile-controls" />
    <script type="module" src="./js/app.js?v=20261030-mobile-controls"></script>
  </head>
  <body>
    <main id="map-screen">
      <canvas
        id="map-canvas"
        tabindex="0"
        aria-label="Cardiff and Vale of Glamorgan vector map. Type move LUC, move Cardiff, zoom 1 through 10, radar cafes, print, or help, then press Enter. Use Up and Down for command history, Tab for completion, and arrows or numbers followed by Enter to select search results."
      ></canvas>
      <form id="mobile-terminal" aria-label="Map commands">
        <input id="mobile-command" type="text" aria-label="Map command" placeholder="move Cardiff / zoom 7 / help" maxlength="64" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
        <button type="submit">RUN</button>
        <nav id="mobile-controls" aria-label="Terminal controls">
          <button type="button" data-key="ArrowUp" aria-label="Previous command or result">PREV</button>
          <button type="button" data-key="ArrowDown" aria-label="Next command or result">NEXT</button>
          <button type="button" data-key="Tab" aria-label="Complete command">COMPLETE</button>
          <button type="button" data-key="Escape" aria-label="Cancel command or radar">CANCEL</button>
        </nav>
      </form>
      <noscript>This map requires JavaScript.</noscript>
    </main>
  </body>
</html>
