<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>LUC Vector Map</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main id="map-screen">
      <canvas
        id="map-canvas"

    </main>
  </body>
